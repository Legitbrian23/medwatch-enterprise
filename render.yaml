services:
  # Backend API Service
  - type: web
    name: medwatch-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @medwatch/shared build && pnpm --filter @medwatch/api build
    startCommand: pnpm --filter @medwatch/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: medwatch
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d

  # Frontend Web Static Site
  - type: web
    name: medwatch-web
    env: static
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @medwatch/shared build && pnpm --filter @medwatch/web build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medwatch-api
          property: host
      - key: VITE_DEMO_MODE
        value: "true"
